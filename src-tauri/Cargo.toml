[package]
name = "gotek-manager"
version = "0.4.0"
description = "Organise, provision, and manage GoTek media"
authors = ["GoTek Manager"]
edition = "2021"

[lib]
name = "gotek_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gotek-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fatfs = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.36"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["time"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

# Development builds are optimised enough to carry a real library.
#
# A workspace of forty-five thousand titles is twenty-five megabytes of JSON on
# its way to the window. Unoptimised that took twenty seconds to read and
# serialise; at these settings it takes two.
#
# Both entries are needed, and the first is the one that matters. Serde writes
# its `Serialize` implementations into *this* crate, so the loop that does the
# work is this crate's code however well the dependencies are built — optimising
# them alone changed nothing measurable. Level 1 is enough for that loop and
# leaves rebuilds after an edit quick; the dependencies, which are rebuilt only
# when they change, are given the lot.
[profile.dev]
opt-level = 1
# Optimising turns on rustc's own cross-unit inlining, which emits internal
# symbols that the lld this toolchain links with refuses ("undefined hidden
# symbol: anon.<hash>.llvm.<hash>"). Nothing here needs that inlining — the
# gain above came from optimising each unit at all, not from merging them — so
# it is switched off rather than the optimisation given up.
lto = "off"

[profile.dev.package."*"]
opt-level = 3
