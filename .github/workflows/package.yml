name: Package desktop application

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - ".cargo/audit.toml"
      - ".github/workflows/package.yml"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # The runner image ships Google's Chrome apt repository, which nothing
      # here uses. When that repository serves an index apt rejects, and it
      # does from time to time, `apt-get update` fails outright and takes every
      # Linux job with it: a release was blocked by it twice in a row, on a
      # "Hash Sum mismatch" for a package this project never installs. Dropping
      # the source first means a repository we do not depend on cannot stop us
      # building. Matched on what the file says rather than on its name, because
      # the image is free to declare it in either apt format and under any
      # filename it likes.
      - name: Install Linux desktop dependencies
        run: |
          sudo grep -rl dl.google.com /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | sudo xargs -r rm -f
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Type-check, check, and test
        run: npm run verify
      - name: Lint the native code
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  # Known advisories against what the application actually ships.
  #
  # Dependabot already reports these on the repository; this is the same
  # question asked where it can block a merge, and where a decision about an
  # advisory is written down next to the code rather than in a web interface.
  # `.cargo/audit.toml` holds those decisions and says why each was made.
  #
  # Unsound and yanked advisories are treated as failures, not notes: the one
  # advisory this project carries is an unsoundness, and a default run would
  # have passed straight over it. Unmaintained crates stay a warning, because
  # nobody can act on those on the day they appear.
  audit:
    name: Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - name: Audit the dependency tree
        run: cargo audit --deny unsound --deny yanked --file src-tauri/Cargo.lock

  package:
    name: ${{ matrix.name }}
    needs: [verify, audit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            bundles: deb,rpm,appimage
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            bundles: deb
            target: aarch64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            bundles: msi,nsis
            target: x86_64-pc-windows-msvc
          - name: windows-aarch64
            os: windows-11-arm
            bundles: msi,nsis
            target: aarch64-pc-windows-msvc
          - name: macos-aarch64
            os: macos-14
            bundles: app,dmg
            target: aarch64-apple-darwin
          # Built on the Apple Silicon runner rather than an Intel one: the
          # macos-13 image is retired, so that job simply queued forever. Xcode
          # carries both SDKs, so the Intel target cross-builds here.
          - name: macos-x86_64
            os: macos-14
            bundles: app,dmg
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # See the note on the same step above.
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo grep -rl dl.google.com /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | sudo xargs -r rm -f
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev rpm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build bundles
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify Unix executable name
        if: runner.os != 'Windows'
        shell: bash
        run: test -x "src-tauri/target/${{ matrix.target }}/release/gotek-manager"
      - name: Verify Windows executable name
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/target/${{ matrix.target }}/release/gotek-manager.exe")) {
            throw "Expected gotek-manager.exe was not built"
          }
      - name: Verify Debian command installation
        if: startsWith(matrix.name, 'linux-')
        shell: bash
        run: |
          package="$(find "src-tauri/target/${{ matrix.target }}/release/bundle/deb" -name '*.deb' -print -quit)"
          # Not piped straight into grep: grep -q closes the pipe on its first
          # match, dpkg-deb then fails to write, and pipefail fails the step
          # for a check that in fact passed.
          contents="$(dpkg-deb --contents "$package")"
          grep -q 'usr/bin/gotek-manager$' <<<"$contents"
      # Building for an explicit target writes under target/<target>/, not
      # under target/. Uploading the latter found nothing on every platform.
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: gotek-manager-${{ matrix.name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error

  # A tag build is only a release once the installers are somewhere a person can
  # download them. Workflow artifacts expire and need a GitHub account to fetch,
  # so a tag also produces a release with the installers attached to it.
  #
  # It is created as a draft on purpose: publishing is a decision for a person,
  # made after looking at what was actually built.
  release:
    name: Draft release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Collect every platform's packages
        uses: actions/download-artifact@v4
        with:
          path: packages
      # The application's own update check downloads the installer made for the
      # way it was installed, and will not use one that does not match this
      # file. It names each installer as GitHub serves it: GitHub turns the
      # spaces in an uploaded file's name into dots, so the files are renamed
      # the same way first and the checksums name exactly what is downloaded.
      # src-tauri/src/update.rs builds the same names (release_stem).
      - name: Collect the installers and their checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          # The .app bundle is a directory and cannot be attached; its .dmg can.
          while IFS= read -r -d '' installer; do
            name="$(basename "$installer")"
            name="${name// /.}"
            if [ -e "release/$name" ]; then
              echo "Two platforms produced $name; not drafting a release." >&2
              exit 1
            fi
            cp "$installer" "release/$name"
          done < <(find packages -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) -print0)

          # Six targets must each have produced something. A release missing a
          # platform is worse than a build that failed loudly.
          count="$(find release -type f | wc -l)"
          if [ "$count" -lt 6 ]; then
            echo "Fewer installers than there are platforms; not drafting a release." >&2
            exit 1
          fi

          # Written after the installers are in place, and naming only them, so
          # the file never lists itself.
          (cd release && sha256sum -- * > ../SHA256SUMS)
          mv SHA256SUMS release/
          printf 'Attaching %d installers and SHA256SUMS:\n' "$count"
          cat release/SHA256SUMS

      - name: Attach the installers to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "GoTek Manager ${GITHUB_REF_NAME}" \
            --notes-file .github/RELEASE_NOTES.md \
            release/*
